name: CI

# Every Pull Request installs the service and runs its tests on a clean machine.
# "It works on my computer" is not evidence; a green check here is.
# Only Pull Requests into develop and qa (instructor's rule, git-conventions.md).

on:
  pull_request:
    branches: [develop, qa]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install '.[test]'
      - run: python -m pytest
